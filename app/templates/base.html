<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Shreya G K — Software Engineer · AI Systems · Test Automation{% endblock %}</title>
  <meta name="description" content="{% block desc %}{{ p.profile.value_prop }}{% endblock %}">
  <meta name="theme-color" content="#fee3c5">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ self.title() | trim }}">
  <meta property="og:description" content="{{ p.profile.value_prop }}">
  <meta property="og:image" content="{{ site_url }}/static/img/og.png">
  <meta property="og:image:alt" content="Shreya G K — Software Engineer, AI Systems, Test Automation">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/app.js" defer></script>
  <script src="/static/js/boot.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Shreya G K, home"><span class="brand-mark" aria-hidden="true">S</span><span>Shreya G K</span></a>
    <nav aria-label="Primary">
      <ul>
        <li><a href="/#why">Why hire</a></li>
        <li><a href="/#projects">Projects</a></li>
        <li><a href="/#playground">Playground</a></li>
        <li><a href="/#experience">Experience</a></li>
        <li><a href="/#skills">Skills</a></li>
        <li><a href="/#contact">Contact</a></li>
        <li><a href="/resume">Resume</a></li>
      </ul>
    </nav>
  </header>
  <main id="main" tabindex="-1">
  {% block main %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>© Shreya G K. Project descriptions are drawn from my resume unless a live demo is linked.</p>
    <p><a href="#main">Back to top ↑</a></p>
  </footer>
</body>
</html>
